<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Dewly</title>
    <meta name="description" content="Read what's actually in your skincare, and when to use it." />
    <meta name="theme-color" content="#FBF2CC" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Dewly's butter background. The root layout renders nothing until the
           Fraunces/Inter webfonts resolve, so without this the first paint is
           the browser's default white — a flash of the wrong colour before the
           app appears. Native gets the same treatment from the splash screen,
           which has no equivalent on the web. */
        background-color: #FBF2CC;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
